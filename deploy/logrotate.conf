# Opensheeta 日志轮转配置
# 安装: sudo cp deploy/logrotate.conf /etc/logrotate.d/opensheeta

/opt/opensheeta/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 opensheeta opensheeta
    sharedscripts
    postrotate
        # 重新加载服务以重新打开日志文件
        systemctl reload opensheeta > /dev/null 2>&1 || true
        systemctl reload opensheeta-dashboard > /dev/null 2>&1 || true
    endscript
}

# 开发环境日志轮转
/Users/travis/Developer/repos/neuralj/opensheeta/logs/*.log {
    daily
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    create 0644 travis staff
    sharedscripts
    postrotate
        # 在开发环境中，重启服务
        cd /Users/travis/Developer/repos/neuralj/opensheeta && scripts/services restart > /dev/null 2>&1 || true
    endscript
}
