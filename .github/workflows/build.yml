name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm ci
      
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      
      - name: Install dashboard dependencies
        run: cd dashboard && npm ci
      
      - name: Build backend
        run: npm run build:backend
      
      - name: Build frontend
        run: npm run build:frontend
      
      - name: Build dashboard
        run: npm run build:dashboard
      
      - name: Create release tarball
        run: |
          mkdir -p release
          cp -r dist release/
          cp package.json release/
          cp -r frontend/dist release/public
          cp -r dashboard/build release/dashboard
          tar -czf opensheeta-${{ github.ref_name }}.tar.gz -C release .
      
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensheeta-${{ github.ref_name }}
          path: opensheeta-${{ github.ref_name }}.tar.gz
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: opensheeta-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
